name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: clothing_store_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath
          ini-values: max_execution_time=120
      
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev
      
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      
      - name: Run MySQL migrations
        run: |
          php artisan migrate --force --configuration=phpunit.mysql.xml
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: clothing_store_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
      
      - name: Run SQLite tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: :memory:
      
      - name: Run MySQL tests
        run: php artisan test --configuration=phpunit.mysql.xml
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: clothing_store_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
      
      - name: Run random-order tests
        run: php artisan test --order-by=random
      
      - name: Check code style
        run: ./vendor/bin/pint --test